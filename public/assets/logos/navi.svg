<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Navi UPI</title>
  <defs>
    <linearGradient id="navi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D09C"/>
      <stop offset="100%" stop-color="#0D7377"/>
    </linearGradient>
  </defs>
  <!-- Authentic App Rounded Tile -->
  <rect width="48" height="48" rx="11" fill="url(#navi-bg)"/>
  
  <!-- Navi Iconic Brand Symbol: Geometric Upward Growth 'N' & Wordmark -->
  <g fill="#FFFFFF">
    <!-- Left vertical bar -->
    <path d="M 11 13 L 15.5 13 L 15.5 35 L 11 35 Z"/>
    <!-- Diagonal upward-thrusting arrow bar -->
    <path d="M 15.5 13 L 32.5 30.5 L 32.5 35 L 28 35 L 15.5 22 Z"/>
    <!-- Right vertical bar with arrow crest -->
    <path d="M 32.5 13 L 37 13 L 37 35 L 32.5 35 Z"/>
    <!-- Upward Arrow Crest on Right Peak -->
    <polygon points="34.75,9 40,15 29.5,15" fill="#FFFFFF"/>
  </g>
</svg>

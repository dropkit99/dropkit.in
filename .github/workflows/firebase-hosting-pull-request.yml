name: DropKit Firebase Pull Request Preview Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  test_and_preview:
    name: Test & Deploy Temporary Preview Channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qrcode

      - name: Run DropKit Test Suite
        run: |
          python tests/test_backend.py

      - name: Deploy to Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DROPKIT }}
          projectId: dropkit-app
